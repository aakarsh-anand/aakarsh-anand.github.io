# Site settings for aakarsh-anand.github.io (Jekyll, built and served by GitHub Pages).
# Preview locally:  bundle exec jekyll serve --livereload   (restart after editing this file)

title: Aakarsh Anand
description: >-
  CS PhD student at UCLA building foundation models and statistical methods for biobank-scale
  health data.
url: https://aakarsh-anand.github.io
baseurl: ""
lang: en_US
timezone: America/Los_Angeles

author:
  name: Aakarsh Anand
  email: aakarsh@cs.ucla.edu
  scholar: https://scholar.google.com/citations?user=icSvTl8AAAAJ
  github: https://github.com/aakarsh-anand
  linkedin: https://www.linkedin.com/in/aakarsh-anand-ml/
  orcid: https://orcid.org/0009-0008-9581-3827

# Used by jekyll-seo-tag for link previews and search results
image: /images/headshot2.jpg
social:
  name: Aakarsh Anand
  links:
    - https://scholar.google.com/citations?user=icSvTl8AAAAJ
    - https://github.com/aakarsh-anand
    - https://www.linkedin.com/in/aakarsh-anand-ml/
    - https://orcid.org/0009-0008-9581-3827

# Own layouts only; stops GitHub Pages from adding its default Primer theme
theme: null

collections:
  art:
    output: true
    permalink: /art/:name/

defaults:
  - scope: {path: ""}
    values: {layout: page}
  - scope: {path: "", type: art}
    values: {layout: art-piece}

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo

exclude:
  - cv/
  - temp/
  - tools/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
